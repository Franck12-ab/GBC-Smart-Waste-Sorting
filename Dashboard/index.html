<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoSort - Smart Waste Classification</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Smart Waste Classification</h1>
        <form id="upload-form">
            <input type="file" id="image-input" accept="image/*" required><br><br>
            <button type="submit" class="upload-btn">Predict</button>
        </form>
        <div id="result" class="hidden">Processing...</div>
    </div>

    <script>
        document.getElementById('upload-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const fileInput = document.getElementById('image-input');
            const resultDiv = document.getElementById('result');

            resultDiv.textContent = 'Processing...';
            resultDiv.classList.remove('hidden');

            const formData = new FormData();
            formData.append('file', fileInput.files[0]);

            try {
                const response = await fetch('http://127.0.0.1:5000/predict', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (response.ok) {
                    resultDiv.textContent = `Prediction: ${data.predicted_class} (confidence: ${data.confidence})`;
                } else {
                    resultDiv.textContent = data.error || 'Prediction failed.';
                }
            } catch (err) {
                resultDiv.textContent = 'Error connecting to backend.';
            }
        });
    </script>
</body>
</html>
